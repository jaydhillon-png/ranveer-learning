<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranveer's Learning Hub</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600&display=swap');

  :root {
    --bg: #f5f7ff;
    --card: #ffffff;
    --primary: #4f46e5;
    --primary-light: #eef2ff;
    --accent: #10b981;
    --accent-light: #d1fae5;
    --warn: #f59e0b;
    --warn-light: #fef3c7;
    --danger: #ef4444;
    --danger-light: #fee2e2;
    --text: #1e1b4b;
    --muted: #6b7280;
    --border: #e5e7eb;
    --radius: 16px;
    --shadow: 0 2px 12px rgba(79,70,229,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 60px;
  }

  h1,h2,h3,h4 { font-family: 'Nunito', sans-serif; }

  /* ── TOP BAR ── */
  .topbar {
    background: var(--primary);
    color: white;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(79,70,229,0.3);
  }
  .topbar-title { font-family:'Nunito',sans-serif; font-size:1.1rem; font-weight:800; }
  .topbar-coins {
    background: rgba(255,255,255,0.2);
    border-radius: 30px;
    padding: 5px 14px;
    font-weight: 700;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ── SECTIONS ── */
  .section { display: none; }
  .section.active { display: block; }

  /* ── HOME ── */
  .home-hero {
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    color: white;
    padding: 36px 20px 28px;
    text-align: center;
  }
  .home-hero h1 { font-size: 1.7rem; margin-bottom: 6px; }
  .home-hero p { opacity: 0.9; font-size: 0.95rem; }

  .sessions-grid {
    padding: 24px 16px;
    display: grid;
    gap: 14px;
    max-width: 640px;
    margin: 0 auto;
  }

  .session-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.2s, transform 0.15s;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .session-card:hover { border-color: var(--primary); transform: translateY(-2px); }
  .session-card.locked { opacity: 0.5; cursor: default; }
  .session-card.done { border-color: var(--accent); }

  .session-icon {
    width: 52px; height: 52px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    flex-shrink: 0;
  }
  .session-info h3 { font-size: 1rem; margin-bottom: 3px; }
  .session-info p { font-size: 0.82rem; color: var(--muted); }
  .session-badge {
    margin-left: auto;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    flex-shrink: 0;
  }
  .badge-done { background: var(--accent-light); color: #065f46; }
  .badge-go   { background: var(--primary-light); color: var(--primary); }
  .badge-lock { background: var(--border); color: var(--muted); }

  /* ── LEDGER ── */
  .ledger-section {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 16px 16px;
  }
  .ledger-toggle {
    width: 100%;
    background: none;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--muted);
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: border-color 0.2s;
  }
  .ledger-toggle:hover { border-color: var(--primary); }
  .ledger-body { display: none; margin-top: 10px; }
  .ledger-body.open { display: block; }

  .ledger-row {
    background: var(--card);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.88rem;
    box-shadow: var(--shadow);
  }
  .ledger-row span { flex: 1; }
  .ledger-row .earned { font-weight: 700; color: var(--accent); }
  .ledger-row .paid-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
  }
  .ledger-row .paid-btn.paid {
    background: var(--border);
    color: var(--muted);
    cursor: default;
  }
  .ledger-empty { color: var(--muted); font-size: 0.88rem; padding: 12px 0; }

  .reset-btn {
    margin-top: 10px;
    background: none;
    border: 1.5px solid var(--danger);
    color: var(--danger);
    border-radius: 10px;
    padding: 8px 16px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
  }

  /* ── SUBJECT PICKER ── */
  .picker-header {
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    color: white;
    padding: 28px 20px 22px;
    text-align: center;
  }
  .picker-header h2 { font-size: 1.4rem; margin-bottom: 4px; }
  .picker-header p  { opacity: 0.85; font-size: 0.9rem; }

  .subjects-grid {
    padding: 20px 16px;
    display: grid;
    gap: 12px;
    max-width: 640px;
    margin: 0 auto;
  }

  .subject-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 20px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.2s, transform 0.15s;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .subject-card:hover { border-color: var(--primary); transform: translateY(-2px); }
  .subject-card.done { border-color: var(--accent); }
  .subject-card.locked { opacity:0.5; cursor:default; }

  .subject-icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem;
    flex-shrink: 0;
  }
  .subject-info h3 { font-size: 0.98rem; margin-bottom: 2px; }
  .subject-info p  { font-size: 0.8rem; color: var(--muted); }
  .subject-score {
    margin-left: auto;
    text-align: right;
    font-size: 0.8rem;
    font-weight: 700;
    flex-shrink: 0;
  }

  .back-btn {
    background: none;
    border: none;
    color: white;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    padding: 8px 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ── LESSON ── */
  .lesson-header {
    background: var(--primary);
    color: white;
    padding: 16px 20px;
  }
  .lesson-meta { font-size: 0.82rem; opacity: 0.8; margin-bottom: 2px; }
  .lesson-title { font-size: 1.2rem; font-weight: 800; font-family: 'Nunito', sans-serif; }

  .progress-bar-wrap {
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    height: 6px;
    margin-top: 10px;
    overflow: hidden;
  }
  .progress-bar-fill {
    background: white;
    height: 100%;
    border-radius: 10px;
    transition: width 0.4s;
  }

  .slide-wrap {
    max-width: 640px;
    margin: 20px auto;
    padding: 0 16px;
  }

  .slide-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 16px;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .slide-num {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .slide-card h2 {
    font-size: 1.2rem;
    color: var(--primary);
    line-height: 1.3;
  }
  .slide-card p {
    font-size: 0.95rem;
    line-height: 1.65;
    color: #374151;
  }
  .slide-card .example-box {
    background: var(--primary-light);
    border-left: 4px solid var(--primary);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.9rem;
    color: var(--text);
    line-height: 1.6;
  }
  .slide-card .remember-box {
    background: var(--warn-light);
    border-left: 4px solid var(--warn);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.9rem;
    font-weight: 600;
    line-height: 1.6;
  }
  .slide-card .recap-box {
    background: var(--accent-light);
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.9rem;
    line-height: 1.7;
  }

  .slide-nav {
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }
  .btn {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    padding: 12px 22px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0); opacity: 0.85; }
  .btn-primary { background: var(--primary); color: white; flex:1; }
  .btn-secondary { background: var(--border); color: var(--text); }
  .btn-accent { background: var(--accent); color: white; flex:1; }

  /* ── QUIZ ── */
  .quiz-header {
    background: var(--primary);
    color: white;
    padding: 16px 20px;
  }
  .quiz-wrap {
    max-width: 640px;
    margin: 20px auto;
    padding: 0 16px;
  }
  .question-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px;
  }
  .q-label { font-size:0.78rem; font-weight:700; color:var(--primary); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:8px; }
  .q-text  { font-size:1.05rem; font-weight:700; line-height:1.5; margin-bottom:18px; color:var(--text); }
  .options { display:grid; gap:9px; }
  .option-btn {
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    text-align: left;
    font-family: 'Nunito Sans', sans-serif;
    font-size: 0.92rem;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    color: var(--text);
  }
  .option-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-light); }
  .option-btn.correct { border-color: var(--accent); background: var(--accent-light); color: #065f46; font-weight:700; }
  .option-btn.wrong   { border-color: var(--danger); background: var(--danger-light); color: #991b1b; font-weight:700; }
  .option-btn:disabled { cursor: default; }

  .feedback-box {
    margin-top: 14px;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 0.88rem;
    line-height: 1.6;
    display: none;
  }
  .feedback-box.show { display: block; }
  .feedback-box.correct { background: var(--accent-light); border:1.5px solid var(--accent); color:#065f46; }
  .feedback-box.wrong   { background: var(--danger-light); border:1.5px solid var(--danger); color:#991b1b; }

  .quiz-footer { margin-top: 14px; display:flex; gap:10px; }

  /* ── RESULTS ── */
  .results-wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px;
    text-align: center;
  }
  .results-trophy { font-size: 4rem; margin-bottom: 12px; }
  .results-score  { font-size: 2.2rem; font-weight: 800; color: var(--primary); margin-bottom: 6px; }
  .results-earned { font-size: 1.1rem; font-weight: 700; color: var(--accent); margin-bottom: 16px; }
  .results-msg {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px 20px;
    font-size: 0.95rem;
    line-height: 1.6;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <span class="topbar-title">📚 Ranveer's Learning Hub</span>
  <span class="topbar-coins" id="topbarCoins">🪙 £0.00</span>
</div>

<!-- ══════════════════════════════════════════════
     HOME
     ══════════════════════════════════════════════ -->
<div id="home" class="section active">
  <div class="home-hero">
    <h1>Hello, Ranveer! 👋</h1>
    <p>Pick a session below to start learning and earning coins.</p>
  </div>

  <div class="sessions-grid" id="sessionsGrid"></div>

  <div class="ledger-section">
    <button class="ledger-toggle" onclick="toggleLedger()">
      <span>🗂 Parent Coin Ledger</span>
      <span id="ledgerArrow">▼</span>
    </button>
    <div class="ledger-body" id="ledgerBody">
      <div id="ledgerRows"></div>
      <button class="reset-btn" onclick="confirmReset()">Reset all progress</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════
     SESSION / SUBJECT PICKER
     ══════════════════════════════════════════════ -->
<div id="picker" class="section">
  <div class="picker-header" id="pickerHeader">
    <button class="back-btn" onclick="goHome()">← Back</button>
    <h2 id="pickerTitle">Session</h2>
    <p id="pickerSub">Choose a subject to start</p>
  </div>
  <div class="subjects-grid" id="subjectsGrid"></div>
</div>

<!-- ══════════════════════════════════════════════
     LESSON
     ══════════════════════════════════════════════ -->
<div id="lesson" class="section">
  <div class="lesson-header">
    <button class="back-btn" onclick="backToPicker()">← Back</button>
    <div class="lesson-meta" id="lessonMeta"></div>
    <div class="lesson-title" id="lessonTitle"></div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="lessonProgress" style="width:0%"></div>
    </div>
  </div>
  <div class="slide-wrap">
    <div class="slide-card" id="slideCard"></div>
    <div class="slide-nav">
      <button class="btn btn-secondary" id="prevBtn" onclick="prevSlide()">← Back</button>
      <button class="btn btn-primary" id="nextBtn" onclick="nextSlide()">Next →</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════
     QUIZ
     ══════════════════════════════════════════════ -->
<div id="quiz" class="section">
  <div class="quiz-header">
    <button class="back-btn" onclick="backToPicker()">← Back</button>
    <div class="lesson-meta" id="quizMeta"></div>
    <div class="lesson-title" id="quizTitle">Quiz Time</div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="quizProgress" style="width:0%"></div>
    </div>
  </div>
  <div class="quiz-wrap">
    <div class="question-card">
      <div class="q-label" id="qLabel"></div>
      <div class="q-text"  id="qText"></div>
      <div class="options" id="options"></div>
      <div class="feedback-box" id="feedbackBox"></div>
    </div>
    <div class="quiz-footer">
      <button class="btn btn-primary" id="quizNextBtn" style="display:none" onclick="nextQuestion()">Next question →</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════
     RESULTS
     ══════════════════════════════════════════════ -->
<div id="results" class="section">
  <div class="results-wrap">
    <div class="results-trophy" id="resultsTrophy">🏆</div>
    <div class="results-score" id="resultsScore"></div>
    <div class="results-earned" id="resultsEarned"></div>
    <div class="results-msg" id="resultsMsg"></div>
    <button class="btn btn-accent" onclick="backToPicker()" style="margin-bottom:10px;width:100%">Try another subject →</button>
    <button class="btn btn-secondary" onclick="goHome()" style="width:100%">Back to home</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   CURRICULUM DATA
   ═══════════════════════════════════════════════════════════════ */
const CURRICULUM = {
  sessions: [
    {
      id: "s1",
      title: "Session 1",
      emoji: "🔢",
      colour: "#4f46e5",
      bgColour: "#eef2ff",
      subjects: [
        {
          id: "s1_maths",
          name: "Maths",
          topic: "Fractions",
          emoji: "➗",
          colour: "#4f46e5",
          bgColour: "#eef2ff",
          slides: [
            {
              title: "What is a fraction?",
              body: `<p>A fraction is a way of describing <strong>part of something</strong>.</p>
<p>Imagine Ranveer has a chocolate bar with <strong>8 equal pieces</strong>. If he eats 3 of them, he has eaten <strong>3 out of 8</strong> pieces.</p>
<div class="example-box">We write that as: <strong>3/8</strong><br>The bottom number (8) tells you how many equal parts there are in total.<br>The top number (3) tells you how many parts you're talking about.</div>
<div class="remember-box">⭐ Bottom = total parts. Top = parts you have.</div>`,
            },
            {
              title: "Numerator and Denominator",
              body: `<p>The two numbers in a fraction have special names.</p>
<div class="example-box"><strong>Numerator</strong> — the top number (the part you have)<br><strong>Denominator</strong> — the bottom number (the total parts)</div>
<p>Example: Dalveer has <strong>1/4</strong> of a pizza. The denominator is 4 (pizza cut into 4 slices). The numerator is 1 (Dalveer has 1 slice).</p>
<div class="remember-box">⭐ <em>Denominator</em> = <em>D</em>ivided into. <em>Numerator</em> = how many you've <em>N</em>abbed!</div>`,
            },
            {
              title: "Equivalent Fractions",
              body: `<p>Some fractions look different but mean exactly the same amount. These are called <strong>equivalent fractions</strong>.</p>
<p>Think of it this way: if Ranveer cuts his sandwich into 2 pieces and eats 1, he's eaten <strong>1/2</strong>. If he'd cut it into 4 pieces and eaten 2, he'd still have eaten exactly the same amount — that's <strong>2/4</strong>.</p>
<div class="example-box">1/2 = 2/4 = 4/8 — they are all the same!</div>
<div class="remember-box">⭐ Multiply or divide BOTH numbers by the same amount to find an equivalent fraction.</div>`,
            },
            {
              title: "Comparing Fractions",
              body: `<p>When the <strong>denominators are the same</strong>, the bigger the numerator, the bigger the fraction.</p>
<p>Ranveer gets 3/8 of the sweets. Dalveer gets 5/8. Who has more? The denominators are both 8, so compare the tops: 5 > 3. Dalveer has more.</p>
<p>When the <strong>numerators are the same</strong>, the smaller the denominator, the bigger the fraction. (1/2 is bigger than 1/4 — think about it: half a pizza is more than a quarter of a pizza.)</p>
<div class="remember-box">⭐ Same denominator: bigger top = bigger fraction. Same top: smaller bottom = bigger fraction.</div>`,
            },
            {
              title: "Quick Recap",
              body: `<div class="recap-box"><strong>✅ What you've learned today:</strong><br><br>
1. A fraction describes part of a whole.<br>
2. The <strong>numerator</strong> (top) = how many parts you have.<br>
3. The <strong>denominator</strong> (bottom) = total equal parts.<br>
4. <strong>Equivalent fractions</strong> look different but are the same size.<br>
5. To compare fractions: same denominator → compare numerators; same numerator → compare denominators.<br><br>
<strong>Now take the quiz to earn your coins!</strong> 🪙</div>`,
            }
          ],
          quiz: [
            { q:"In the fraction 3/5, what is the denominator?", options:["3","5","2","8"], correct:1, why:"The denominator is always the bottom number. Here, 5 is on the bottom — it tells us the whole is split into 5 equal parts." },
            { q:"Ranveer has 4/8 of a cake and Dalveer has 1/2. Do they have the same amount?", options:["Yes — 4/8 = 1/2","No — 4/8 is bigger","No — 1/2 is bigger","Can't tell"], correct:0, why:"4/8 and 1/2 are equivalent fractions. If you divide the top and bottom of 4/8 by 4, you get 1/2. They are exactly the same amount." },
            { q:"Which fraction is the biggest: 2/6, 4/6, or 1/6?", options:["1/6","2/6","4/6","They are all equal"], correct:2, why:"The denominators are all 6, so we just compare the top numbers. 4 is the biggest, so 4/6 is the biggest fraction." },
            { q:"What is the numerator in 7/10?", options:["10","1","7","17"], correct:2, why:"The numerator is always the top number. Here it's 7 — it tells us we have 7 out of 10 parts." },
            { q:"Ranveer cuts a pizza into 8 slices and eats 2. What fraction did he eat?", options:["8/2","2/8","6/8","2/6"], correct:1, why:"He ate 2 slices out of 8. The number he ate goes on top, the total goes on the bottom: 2/8." },
            { q:"Which two fractions are equivalent?", options:["1/2 and 1/3","3/4 and 6/8","2/3 and 3/4","1/5 and 2/9"], correct:1, why:"Multiply 3/4 by 2/2 (which equals 1, so it doesn't change the value): 3×2=6 on top, 4×2=8 on the bottom = 6/8. So 3/4 and 6/8 are the same." },
            { q:"1/3 is _____ than 1/5.", options:["smaller","the same size as","bigger","impossible to compare"], correct:2, why:"When numerators are the same, the smaller denominator means a bigger fraction. Imagine splitting a cake: thirds are bigger slices than fifths." },

With punctuation: <em>"Let's eat, Ranveer," said Dalveer.</em></div>
<p>You can see how much clearer the second version is — we can even tell who is speaking, when to pause, and that it's a quote.</p>
<div class="remember-box">⭐ Punctuation helps the reader hear your writing. It shows them when to pause, stop, or be surprised.</div>`,
            },
            {
              title: "Full Stops, Question Marks & Exclamation Marks",
              body: `<p>These three all appear at the <strong>end</strong> of a sentence.</p>
<div class="example-box"><strong>Full stop (.)</strong> — ends a normal statement.<br>
<em>Ranveer completed his quiz.</em><br><br>
<strong>Question mark (?)</strong> — ends a question.<br>
<em>Did Dalveer eat the last biscuit?</em><br><br>
<strong>Exclamation mark (!)</strong> — shows strong feeling or surprise.<br>
<em>Ranveer got 10 out of 10!</em></div>
<div class="remember-box">⭐ Only use one end mark per sentence. Never use !! — one is enough.</div>`,
            },
            {
              title: "Commas",
              body: `<p>The <strong>comma (,)</strong> is one of the most useful punctuation marks. It has several jobs:</p>
<div class="example-box"><strong>1. Lists:</strong> Ranveer packed a pencil, a ruler, a rubber, and his lunchbox.<br><br>
<strong>2. Joining clauses:</strong> Ranveer wanted to play outside, but it was raining.<br><br>
<strong>3. Extra information:</strong> My brother, who is called Dalveer, is younger than me.<br><br>
<strong>4. Before speech:</strong> Ranveer said, "I'm ready for the quiz."</div>
<div class="remember-box">⭐ A comma is a short pause, not a stop. If the sentence still makes sense without the commas, they are probably used for extra information.</div>`,
            },
            {
              title: "Apostrophes",
              body: `<p>The <strong>apostrophe (')</strong> has two jobs:</p>
<div class="example-box"><strong>1. Possession</strong> — showing something belongs to someone:<br>
<em>Ranveer's bag</em> = the bag belonging to Ranveer.<br>
<em>Dalveer's book</em> = the book belonging to Dalveer.<br><br>
<strong>2. Contraction</strong> — showing letters have been left out when two words are joined:<br>
<em>do not → don't</em><br>
<em>I am → I'm</em><br>
<em>it is → it's</em></div>
<div class="remember-box">⭐ Its (no apostrophe) = belonging to it. It's (apostrophe) = it is. This is one of the most common mistakes in English!</div>`,
            },
            {
              title: "Quick Recap",
              body: `<div class="recap-box"><strong>✅ What you've learned today:</strong><br><br>
1. Punctuation makes writing clear and easy to read.<br>
2. <strong>Full stop (.):</strong> ends a statement. <strong>?:</strong> ends a question. <strong>!:</strong> strong feeling.<br>
3. <strong>Commas</strong> are used in lists, to join clauses, around extra info, and before speech.<br>
4. <strong>Apostrophes</strong> show possession (Ranveer's) or contraction (don't, I'm).<br>
5. <em>It's</em> = it is. <em>Its</em> = belonging to it.<br><br>
<strong>Time for your final quiz of the session! 🪙</strong></div>`,
            }
          ],
          quiz: [
            { q:"Which punctuation mark ends a question?", options:["Full stop (.)","Comma (,)","Question mark (?)","Exclamation mark (!)"], correct:2, why:"A question mark (?) always ends a direct question. It signals to the reader that an answer is expected." },
            { q:"Ranveer said ___ I got them all right ___. Which punctuation belongs in the gaps?", options:[": and .","\" and \"",", and !","( and )"], correct:1, why:"Speech marks (\") go around the words actually spoken. So: Ranveer said \"I got them all right.\"" },
            { q:"Which sentence uses a comma correctly in a list?", options:["Ranveer packed, a pencil ruler and book.","Ranveer packed a pencil, a ruler and a book.","Ranveer, packed a pencil a ruler and a book.","Ranveer packed a pencil a ruler, and a book."], correct:1, why:"In a list, commas separate the items. 'A pencil, a ruler and a book' is correct — you don't need a comma before 'and' in a simple list." },
            { q:"What does the apostrophe mean in 'Dalveer's pencil'?", options:["Dalveer has more than one pencil","The pencil belongs to Dalveer","Dalveer is a pencil","Letters have been left out"], correct:1, why:"When an apostrophe + s is added to a name, it shows ownership/possession. Dalveer's pencil = the pencil belonging to Dalveer." },
            { q:"Which is correct: 'Its raining' or 'It's raining'?", options:["Its raining","It's raining","Both are correct","Neither is correct"], correct:1, why:"It's with an apostrophe = 'it is'. 'It is raining' — so we write 'it's raining'. 'Its' without an apostrophe means 'belonging to it'." },
            { q:"'don't' is a contraction of which two words?", options:["done not","do not","does not","doing not"], correct:1, why:"'Don't' = 'do not'. The apostrophe shows the letter 'o' in 'not' has been removed when the words were joined." },
            { q:"Which sentence uses an exclamation mark correctly?", options:["Ranveer went to school!","What time is it!","Ranveer scored the winning goal!","I wonder what Dalveer is doing!"], correct:2, why:"Exclamation marks show strong emotion or excitement. Scoring a winning goal is exciting! The other options are normal statements or questions." },
            { q:"Where do the commas go in this sentence: 'My friend who sits next to me is called Aiden.'", options:["'My friend, who sits next to me, is called Aiden.'","'My, friend who sits next to me is called Aiden.'","'My friend who, sits next to me is called Aiden.'","No commas needed"], correct:0, why:"'Who sits next to me' is extra information about 'my friend'. Extra information in the middle of a sentence is surrounded by commas." },
            { q:"Ranveer wrote: 'Ranveers book is on the shelf.' What is missing?", options:["A full stop after 'shelf'","An apostrophe: Ranveer's book","An exclamation mark","A question mark"], correct:1, why:"To show the book belongs to Ranveer, you need an apostrophe + s: Ranveer's. Without it, the sentence looks like 'Ranveers' is a made-up word." },
            { q:"Which sentence is punctuated correctly?", options:["did dalveer eat the last biscuit","Did Dalveer eat the last biscuit?","Did Dalveer eat the last biscuit.","did Dalveer eat the last biscuit?"], correct:1, why:"A sentence starts with a capital letter and a question ends with a question mark. 'Did Dalveer eat the last biscuit?' has both correct." }
          ]
        }
      ]
    }
  ]
};

/* ═══════════════════════════════════════════════════════════════
   STATE & STORAGE
   ═══════════════════════════════════════════════════════════════ */
let state = {
  sessions: {},   // { s1_maths: { done:true, score:8, paid:false, ts:1234 } }
  totalPence: 0
};

function loadState(){
  try {
    const raw = localStorage.getItem("rlh_state_v2");
    if(raw) state = JSON.parse(raw);
  } catch(e){}
  recalcTotal();
}

function saveState(){
  recalcTotal();
  localStorage.setItem("rlh_state_v2", JSON.stringify(state));
}

function recalcTotal(){
  let t = 0;
  for(const k in state.sessions){
    const s = state.sessions[k];
    if(s.done) t += s.score * 25;
  }
  state.totalPence = t;
  document.getElementById("topbarCoins").textContent = `🪙 £${(t/100).toFixed(2)}`;
}

/* ═══════════════════════════════════════════════════════════════
   CURRENT CONTEXT
   ═══════════════════════════════════════════════════════════════ */
let curSession   = null;
let curSubject   = null;
let curSlide     = 0;
let curQuestion  = 0;
let quizAnswered = false;
let quizScore    = 0;

/* ═══════════════════════════════════════════════════════════════
   HOME
   ═══════════════════════════════════════════════════════════════ */
function renderHome(){
  const grid = document.getElementById("sessionsGrid");
  grid.innerHTML = "";

  CURRICULUM.sessions.forEach((sess, idx) => {
    const allDone = sess.subjects.every(sub => state.sessions[sub.id]?.done);
    const anyDone = sess.subjects.some(sub => state.sessions[sub.id]?.done);
    const prevDone = idx === 0 || CURRICULUM.sessions[idx-1].subjects.every(sub => state.sessions[sub.id]?.done);

    let badge = "";
    let extraClass = "";
    if(allDone){
      badge = `<span class="session-badge badge-done">✅ Complete</span>`;
      extraClass = "done";
    } else if(!prevDone && idx > 0){
      badge = `<span class="session-badge badge-lock">🔒 Locked</span>`;
      extraClass = "locked";
    } else {
      badge = `<span class="session-badge badge-go">▶ Go</span>`;
    }

    const subTopics = sess.subjects.map(s=>s.topic).join(" · ");

    const card = document.createElement("div");
    card.className = `session-card ${extraClass}`;
    card.innerHTML = `
      <div class="session-icon" style="background:${sess.bgColour}">${sess.emoji}</div>
      <div class="session-info">
        <h3>${sess.title}</h3>
        <p>${subTopics}</p>
      </div>
      ${badge}`;
    if(!extraClass.includes("locked")){
      card.onclick = () => openPicker(sess.id);
    }
    grid.appendChild(card);
  });

  renderLedger();
}

/* ═══════════════════════════════════════════════════════════════
   LEDGER
   ═══════════════════════════════════════════════════════════════ */
function toggleLedger(){
  const body = document.getElementById("ledgerBody");
  const arrow = document.getElementById("ledgerArrow");
  body.classList.toggle("open");
  arrow.textContent = body.classList.contains("open") ? "▲" : "▼";
}

function renderLedger(){
  const rows = document.getElementById("ledgerRows");
  rows.innerHTML = "";
  let any = false;

  CURRICULUM.sessions.forEach(sess => {
    sess.subjects.forEach(sub => {
      const s = state.sessions[sub.id];
      if(!s?.done) return;
      any = true;
      const earned = `£${(s.score * 25 / 100).toFixed(2)}`;
      const paidBtn = s.paid
        ? `<button class="paid-btn paid">Paid ✓</button>`
        : `<button class="paid-btn" onclick="markPaid('${sub.id}')">Mark paid</button>`;

      const date = s.ts ? new Date(s.ts).toLocaleDateString("en-GB",{day:"numeric",month:"short"}) : "";
      rows.innerHTML += `<div class="ledger-row">
        <span><strong>${sess.title}</strong> · ${sub.name}: ${sub.topic}</span>
        <span class="earned">${s.score}/10 · ${earned}</span>
        <span style="font-size:0.78rem;color:var(--muted)">${date}</span>
        ${paidBtn}
      </div>`;
    });
  });

  if(!any) rows.innerHTML = `<p class="ledger-empty">No completed quizzes yet — get started!</p>`;

  const total = state.totalPence;
  const unpaid = Object.entries(state.sessions)
    .filter(([,s])=>s.done && !s.paid)
    .reduce((acc,[,s])=>acc+s.score*25,0);
  if(any){
    rows.innerHTML += `<div class="ledger-row" style="border-top:2px solid var(--border);margin-top:6px;padding-top:14px">
      <span><strong>Total earned:</strong></span>
      <span class="earned">£${(total/100).toFixed(2)}</span>
      <span style="font-size:0.78rem;color:var(--muted)">Outstanding: £${(unpaid/100).toFixed(2)}</span>
      <span></span>
    </div>`;
  }
}

function markPaid(subId){
  if(state.sessions[subId]) state.sessions[subId].paid = true;
  saveState();
  renderLedger();
}

function confirmReset(){
  if(confirm("Reset ALL progress for Ranveer? This cannot be undone.")){
    state = { sessions:{}, totalPence:0 };
    saveState();
    renderHome();
  }
}

/* ═══════════════════════════════════════════════════════════════
   PICKER
   ═══════════════════════════════════════════════════════════════ */
function openPicker(sessId){
  curSession = CURRICULUM.sessions.find(s=>s.id===sessId);
  document.getElementById("pickerTitle").textContent = curSession.title;
  document.getElementById("pickerSub").textContent = "Choose a subject to start";

  const grid = document.getElementById("subjectsGrid");
  grid.innerHTML = "";

  curSession.subjects.forEach(sub => {
    const s = state.sessions[sub.id];
    const done = s?.done;
    const score = done ? s.score : null;

    const card = document.createElement("div");
    card.className = `subject-card ${done?"done":""}`;
    card.innerHTML = `
      <div class="subject-icon" style="background:${sub.bgColour}">${sub.emoji}</div>
      <div class="subject-info">
        <h3>${sub.name}: ${sub.topic}</h3>
        <p>${sub.slides.length} slides · 10-question quiz</p>
      </div>
      <div class="subject-score">
        ${done ? `<span style="color:var(--accent)">✅ ${score}/10</span><br><span style="color:var(--muted);font-size:0.75rem">£${(score*25/100).toFixed(2)}</span>` : `<span style="color:var(--primary)">▶ Start</span>`}
      </div>`;
    card.onclick = () => startLesson(sub.id);
    grid.appendChild(card);
  });

  showSection("picker");
}

/* ═══════════════════════════════════════════════════════════════
   LESSON
   ═══════════════════════════════════════════════════════════════ */
function startLesson(subId){
  curSubject = null;
  curSession.subjects.forEach(s=>{ if(s.id===subId) curSubject=s; });
  if(!curSubject) return;

  curSlide = 0;
  document.getElementById("lessonMeta").textContent = `${curSession.title} · ${curSubject.name}`;
  document.getElementById("lessonTitle").textContent = curSubject.topic;
  renderSlide();
  showSection("lesson");
}

function renderSlide(){
  const slide = curSubject.slides[curSlide];
  const total = curSubject.slides.length;
  document.getElementById("lessonProgress").style.width = `${((curSlide+1)/total)*100}%`;

  const card = document.getElementById("slideCard");
  card.innerHTML = `<div class="slide-num">Slide ${curSlide+1} of ${total}</div>
    <h2>${slide.title}</h2>
    ${slide.body}`;

  document.getElementById("prevBtn").style.display = curSlide===0 ? "none" : "";
  document.getElementById("nextBtn").textContent = curSlide===total-1 ? "Take the quiz →" : "Next →";
}

function nextSlide(){
  if(curSlide < curSubject.slides.length-1){
    curSlide++;
    renderSlide();
    window.scrollTo({top:0,behavior:"smooth"});
  } else {
    startQuiz();
  }
}

function prevSlide(){
  if(curSlide > 0){ curSlide--; renderSlide(); window.scrollTo({top:0,behavior:"smooth"}); }
}

function backToPicker(){
  openPicker(curSession.id);
}

/* ═══════════════════════════════════════════════════════════════
   QUIZ
   ═══════════════════════════════════════════════════════════════ */
function startQuiz(){
  curQuestion = 0;
  quizScore   = 0;
  document.getElementById("quizMeta").textContent  = `${curSession.title} · ${curSubject.name}`;
  document.getElementById("quizTitle").textContent = `${curSubject.topic} — Quiz`;
  renderQuestion();
  showSection("quiz");
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderQuestion(){
  const q     = curSubject.quiz[curQuestion];
  const total = curSubject.quiz.length;
  document.getElementById("quizProgress").style.width = `${((curQuestion+1)/total)*100}%`;
  document.getElementById("qLabel").textContent = `Question ${curQuestion+1} of ${total}`;
  document.getElementById("qText").textContent  = q.q;
  document.getElementById("feedbackBox").className = "feedback-box";
  document.getElementById("feedbackBox").textContent = "";
  document.getElementById("quizNextBtn").style.display = "none";

  const opts = document.getElementById("options");
  opts.innerHTML = "";
  q.options.forEach((opt,i)=>{
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.textContent = opt;
    btn.onclick = ()=>answerQuestion(i);
    opts.appendChild(btn);
  });
  quizAnswered = false;
}

function answerQuestion(idx){
  if(quizAnswered) return;
  quizAnswered = true;
  const q    = curSubject.quiz[curQuestion];
  const btns = document.querySelectorAll(".option-btn");
  btns.forEach(b=>b.disabled=true);

  const correct = idx === q.correct;
  if(correct) quizScore++;

  btns[q.correct].classList.add("correct");
  if(!correct) btns[idx].classList.add("wrong");

  const fb = document.getElementById("feedbackBox");
  fb.className = `feedback-box show ${correct?"correct":"wrong"}`;
  fb.innerHTML = `<strong>${correct?"✅ Correct!":"❌ Not quite."}</strong> ${q.why}`;

  document.getElementById("quizNextBtn").style.display = "block";
  document.getElementById("quizNextBtn").textContent =
    curQuestion < curSubject.quiz.length-1 ? "Next question →" : "See my results →";
}

function nextQuestion(){
  curQuestion++;
  if(curQuestion < curSubject.quiz.length){
    renderQuestion();
    window.scrollTo({top:0,behavior:"smooth"});
  } else {
    showResults();
  }
}

/* ═══════════════════════════════════════════════════════════════
   RESULTS
   ═══════════════════════════════════════════════════════════════ */
function showResults(){
  const earned = quizScore * 25;
  const prev = state.sessions[curSubject.id];
  const isNew = !prev?.done;
  const improved = prev?.done && quizScore > prev.score;

  state.sessions[curSubject.id] = {
    done: true,
    score: quizScore,
    paid: prev?.paid || false,
    ts: Date.now()
  };
  saveState();

  let trophy = quizScore===10?"🏆":quizScore>=8?"⭐":quizScore>=5?"👍":"📚";
  let msg = quizScore===10
    ? "Perfect score — every single one correct! 🎉 That's a maximum coin haul."
    : quizScore>=8
    ? "Really strong score. 8 or more right — nicely done."
    : quizScore>=5
    ? "Solid effort. Worth having a look back over the slides for the ones that tripped you up."
    : "That was a tricky one. Have another look at the slides when you're ready — they'll make more sense second time around.";

  if(!isNew && improved) msg += ` And that's better than last time — great improvement!`;

  document.getElementById("resultsTrophy").textContent = trophy;
  document.getElementById("resultsScore").textContent = `${quizScore} / 10`;
  document.getElementById("resultsEarned").textContent = `🪙 You earned £${(earned/100).toFixed(2)} in coins`;
  document.getElementById("resultsMsg").textContent = msg;

  showSection("results");
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ═══════════════════════════════════════════════════════════════
   NAVIGATION HELPER
   ═══════════════════════════════════════════════════════════════ */
function showSection(id){
  ["home","picker","lesson","quiz","results"].forEach(s=>{
    const el = document.getElementById(s);
    el.style.display = s===id ? "block" : "none";
    el.classList.toggle("active", s===id);
  });
}

function goHome(){
  showSection("home");
  renderHome();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ═══════════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════════ */
loadState();
showSection("home");
renderHome();
</script>
</body>
</html>
